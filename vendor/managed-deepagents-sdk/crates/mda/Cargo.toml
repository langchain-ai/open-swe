[package]
name = "mda"
description = "Managed Deep Agents CLI: compile a Deep Agent repo into a managed LangGraph runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "mda"
path = "src/bin/mda.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.4"
console = "0.16"
crc32fast = "1"
ctrlc = "3"
dotenvy = "0.15.7"
flate2 = "1"
is_ci = "1.2"
notify = "8"
opentelemetry = { version = "0.33", default-features = false, features = [
    "logs",
] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-json",
    "logs",
    "reqwest-blocking-client",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "logs",
] }
oxc = "0.154.0"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.11", default-features = false }
tar = "0.4"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
# PEP 440 specifier parsing for `requires-python`. Pinned exactly: this is
# uv's internal crate on a 0.0.x line, so minor bumps may break the API.
uv-pep440 = "=0.0.93"
uuid = { version = "1.24.0", default-features = false, features = [
    "std",
    "v4",
] }
walkdir = "2"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "logs",
    "testing",
] }
tempfile = "3"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
signal-hook = "0.4"
