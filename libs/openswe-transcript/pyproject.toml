[project]
name = "openswe-transcript"
version = "0.1.0"
description = "Open SWE's live transcript stream, shared by the backend and the runtimes that host its agents elsewhere."
readme = "README.md"
# Managed Deep Agents builds run Python 3.13; the backend runs 3.14.
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12.0,<3.0.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openswe_transcript"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"
