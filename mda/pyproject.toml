[project]
name = "open-swe-runtime"
version = "0.0.0"
description = "Open SWE's coding agent and pull request reviewer as one Managed Deep Agent; the Open SWE backend serves their tools."
requires-python = ">=3.14"
dependencies = [
    "managed-deepagents>=0.10.1",
    "deepagents==0.7.32",
    # Remove this explicit dependency after upgrading to deepagents 0.7.33 once released.
    "langchain-core>=1.7.4,<2",
    "langchain[mcp]>=1.4.8",
    "langchain-anthropic>=1.7.9",
    # Fireworks models the dashboard offers, such as Kimi.
    "langchain-fireworks>=1.7.1,<2.0.0",
    "langchain-openai>=1.7.3,<2.0.0",
    "langchain-quickjs>=0.3.11,<0.4.0",
    "langsmith>=0.14.17",
    "httpx2>=2.12.0",
    # The vendored SDK's browser installs its extension from this package, so this
    # matches managed_deepagents.browser.STAGEHAND_VERSION.
    "stagehand==4.3.0",
    # The browser's tools; matches the pin `mda` injects into browser builds.
    "stagehand-middleware==0.1.0",
    "mcp>=2.2.0",
    "pydantic>=2.11",
    "open-swe-runtime-api",
]

# Not `dev`, which uv installs by default: deploys stay without test tooling.
[dependency-groups]
# PROTOTYPE: transcript benchmark server deps.
bench = ["langgraph-api", "langgraph-cli[inmem]", "langgraph-runtime-inmem", "langgraph-grpc-common"]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Vendored, with the `mda` CLI `make mda-cli` builds into it (vendor/README.md).
# Editable, so that CLI is read from the source tree.
[tool.uv.sources]
managed-deepagents = { path = "../vendor/managed-deepagents-sdk/packages/pypi", editable = true }
# The code mode, vendored too, so Open SWE can change it before upstream does.
langchain-quickjs = { path = "../vendor/langchain-quickjs", editable = true }
# Shared with the backend; `mda build` bundles it as a local package.
open-swe-runtime-api = { path = "../packages/runtime-api", editable = true }
# PROTOTYPE: transcript benchmark.
deepagents = { path = "/Users/cwlbraa/src/deepagents-transcript/libs/deepagents", editable = true }
langgraph = { path = "/Users/cwlbraa/src/langgraph-transcript/libs/langgraph", editable = true }
langgraph-api = { path = "/Users/cwlbraa/src/langchainplus/.claude/worktrees/suspicious-mendeleev-1b1147/langgraph-api/api", editable = true }
langgraph-grpc-common = { path = "/Users/cwlbraa/src/langchainplus/.claude/worktrees/suspicious-mendeleev-1b1147/langgraph-api/grpc_common_py", editable = true }
langgraph-core-bin = { path = "/Users/cwlbraa/src/langchainplus/.claude/worktrees/suspicious-mendeleev-1b1147/langgraph-api/core_python", editable = true }
langgraph-runtime-inmem = { path = "/Users/cwlbraa/src/langchainplus/.claude/worktrees/suspicious-mendeleev-1b1147/langgraph-api/runtime_inmem", editable = true }

# Its own type-check root: checked against this project's environment alone, an
# import of the backend (`openswe`) or a database driver fails to resolve.
[tool.ty.src]
include = ["agent.py", "identity.py", "channels", "rt", "tests"]
# Run in the sandbox on its own python3; `make typecheck` checks them at 3.8.
exclude = ["rt/sandbox_scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `agent` and `rt` import from the project root, as `mda build` lays them out.
pythonpath = ["."]
