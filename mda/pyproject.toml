[project]
name = "open-swe-runtime"
version = "0.0.0"
description = "Robin's coding agent and pull request reviewer as one Managed Deep Agent; the Robin backend serves their tools."
requires-python = ">=3.14"
dependencies = [
    "managed-deepagents>=0.10.1",
    "deepagents==0.7.41",
    "langchain[mcp]>=1.5.2",
    "langchain-anthropic>=1.7.12",
    # Fireworks models the dashboard offers, such as Kimi.
    "langchain-fireworks>=1.7.3,<2.0.0",
    # Gemini models the dashboard offers; it arrived only through deepagents before.
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5,<2.0.0",
    "langchain-quickjs>=0.4.0,<0.5.0",
    "langsmith>=0.15.1",
    "httpx2>=2.12.0",
    # Renders the prompts in prompts/, as the backend renders its own.
    "jinja2>=3.1.6",
    # The SDK's browser installs its extension from this package, so this
    # matches managed_deepagents.browser.STAGEHAND_VERSION.
    "stagehand==4.4.0",
    # The browser's tools; matches the pin `mda` injects into browser builds.
    "stagehand-middleware==0.1.2",
    "mcp>=2.2.0",
    # fetch_url, which MDA runs itself; its results match the backend's only at
    # the versions it runs.
    "markdownify==1.2.3",
    "pydantic>=2.11",
    "open-swe-runtime-api",
]

# Not `dev`, which uv installs by default: deploys stay without test tooling.
[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# The SDK's mda/0.11 branch in langchainplus, at a pinned commit until 0.11 is released;
# `make mda-cli` builds the `mda` CLI from the same commit into the installed runtime,
# and the backend's pyproject.toml pins the same commit (vendor/README.md).
[tool.uv.sources]
managed-deepagents = { git = "https://github.com/langchain-ai/langchainplus", rev = "fe64cf81524d28e8fcea2bbb92f218c753d4cdb4", subdirectory = "sdks/managed-deepagents/packages/pypi" }
# The code mode, vendored so Robin can change it before upstream does.
langchain-quickjs = { path = "../vendor/langchain-quickjs", editable = true }
# Shared with the backend; `mda build` bundles it as a local package.
open-swe-runtime-api = { path = "../packages/runtime-api", editable = true }

# Its own type-check root: checked against this project's environment alone, an
# import of the backend (`openswe`) or a database driver fails to resolve.
[tool.ty.src]
include = ["agent.py", "identity.py", "channels", "rt", "tests"]
# Run in the sandbox on its own python3; `make typecheck` checks them at 3.8.
exclude = ["rt/sandbox_scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `agent` and `rt` import from the project root, as `mda build` lays them out.
pythonpath = ["."]
