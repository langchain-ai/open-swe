[project]
name = "open-swe-reviewer-runtime"
version = "0.0.0"
description = "Open SWE's pull request reviewer as a Managed Deep Agent; the Open SWE backend serves its tools."
requires-python = ">=3.12"
dependencies = [
    "managed-deepagents>=0.9.1.dev1",
    "deepagents==0.7.21",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.5,<2.0.0",
    "langsmith>=0.14.0",
    "httpx2>=2.12.0,<3.0.0",
    "mcp>=2.2.0,<3",
    "pydantic>=2.11",
]

[tool.mda]
python-version = "3.14"
