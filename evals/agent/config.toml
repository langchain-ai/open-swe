dataset_name = "openswe-agent-v1"
experiment_prefix = "openswe-agent-baseline"
max_concurrency = 4

# LangSmith tracing project for eval runs. Keeps eval traces out of the
# deployment's production project.
langsmith_project = "open-swe-evals"

# Leave blank to use LANGGRAPH_URL or local dev.
langgraph_url = ""
assistant_id = "agent"
# models: openai:gpt-5.6-sol, anthropic:claude-opus-5, google_genai:gemini-3.8-flash
model_id = "anthropic:claude-opus-5"
reasoning_effort = "medium"

# Surface the agent graph runs under: "eval" (default) or "desktop".
# "desktop" is the product's local-execution path — it skips GitHub App token
# resolution, which is what a local-sandbox run without App credentials needs.
# Only use it when the server's SANDBOX_TYPE is local.
run_source = "eval"

# For run_source = "desktop": the directory the agent works in. It must be
# allowlisted in the server's OPEN_SWE_LOCAL_PROJECTS_FILE (or live under
# OPEN_SWE_LOCAL_WORKTREES_DIR) — the desktop path refuses anything else.
local_project_dir = ""

# SWE-bench-style instances (JSONL). See README.md for the schema and how to
# build one from the HuggingFace SWE-bench datasets.
instances_path = "evals/agent/instances/swe_bench_verified.jsonl"

# Per-install-command and pytest timeout, seconds. Repo installs for big
# projects (django, sympy) can take a while on a cold runner.
test_timeout_seconds = 1800
