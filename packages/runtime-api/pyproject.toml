[project]
name = "open-swe-runtime-api"
version = "0.0.0"
description = "The typed contract between Robin's backend and its Managed Deep Agents runtime (mda/): every call MDA makes and what it answers."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    # Both sides build the run's chat models from the one table and builder (models.py).
    "langchain>=1.4.10",
    "langchain-openai>=1.7.4,<2.0.0",
    # Jev, the gateway's classifier, which both sides ask (classifier.py).
    "langchain-typesafe==0.0.2",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_api"]
