[project]
name = "open-swe-runtime-api"
version = "0.0.0"
description = "The typed contract between Open SWE's backend and its Managed Deep Agents runtime (mda/): every call MDA makes and what it answers."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_api"]
