[project]
name = "open-swe-shared"
version = "0.0.0"
description = "What Open SWE's backend and its Managed Deep Agents runtime (mda/) both build runs from: the model-facing prompts, the input message envelope, and fetching what a message links to."
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.12.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openswe_shared"]
