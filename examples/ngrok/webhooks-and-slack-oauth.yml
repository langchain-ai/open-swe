# The Slack HTTPS callback redirects in the browser to localhost, where its
# session and OAuth nonce cookies live. Only signed webhooks reach the backend.
on_http_request:
  - expressions:
      - "req.method == 'GET' && req.url.path == '/dashboard/api/slack/callback'"
    actions:
      - type: custom-response
        config:
          status_code: 302
          headers:
            location: 'http://localhost:2024/dashboard/api/slack/callback?${req.url.query}'
            cache-control: no-store
            referrer-policy: no-referrer
  - expressions:
      - "!req.url.path.startsWith('/webhooks/')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          headers:
            content-type: text/plain
          body: Not found
