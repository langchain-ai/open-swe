# ngrok traffic policy for a local Open SWE backend: only the webhook endpoints are public.
# GitHub and Slack only ever call /webhooks/*, so nothing else on the backend goes public; the
# LangGraph API's own auth is the first layer, this allowlist the second. `make tunnel` passes
# this file to `ngrok http 2024`; any other tunnel needs an equivalent allowlist.
on_http_request:
  - expressions:
      - "!req.url.path.startsWith('/webhooks/')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          headers:
            content-type: text/plain
          body: Not found
