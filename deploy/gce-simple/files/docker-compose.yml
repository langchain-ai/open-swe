# Single-box Open SWE stack: backend (LangGraph in-memory server), the dashboard
# UI (TanStack Start SSR node server), and Caddy terminating TLS via Let's
# Encrypt. Build contexts are relative to this file; the repo root is three
# levels up.
services:
  backend:
    build:
      context: ../../..
      dockerfile: deploy/gce-simple/files/Dockerfile.backend
    restart: unless-stopped
    # No env_file: langgraph loads /app/.env itself (python-dotenv), which
    # correctly expands the escaped newlines in the multiline GitHub App key.
    volumes:
      - /opt/open-swe/.env:/app/.env:ro
      # langgraph dev's inmem runtime persists checkpoints, store, and the run
      # queue here (pickled, flushed every ~10s) and reloads on boot. Keeping it
      # on a volume is what lets run state survive a container restart/rebuild.
      - langgraph_data:/app/.langgraph_api
    expose:
      - "2024"

  ui-build:
    image: node:22-slim
    working_dir: /app/ui
    environment:
      # Empty => same-origin /dashboard/api/* (Caddy proxies it to the backend).
      VITE_DASHBOARD_API_BASE_URL: ""
    volumes:
      - ../../..:/app
    command:
      - sh
      - -c
      - >
        corepack enable &&
        corepack prepare pnpm@11.9.0 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm run build

  ui:
    image: node:22-slim
    working_dir: /app/ui
    restart: unless-stopped
    depends_on:
      ui-build:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_PORT: "3000"
    volumes:
      - ../../..:/app
    command: ["node", ".output/server/index.mjs"]
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      ui:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  langgraph_data:
