# Template for the SOPS secrets file. Copy to secrets.enc.yaml, fill it in, then
# encrypt in place:
#
#   cp secrets.example.yaml secrets.enc.yaml
#   sops -e -i secrets.enc.yaml     # or: sops secrets.enc.yaml  (edit + encrypt)
#
# Flat KEY: value map — each becomes a line in the backend .env on the box.
# Only fill the sections for the triggers you use. DOMAIN / ACME_EMAIL are added
# from Terraform at boot; do not set them here.

OPENAI_API_KEY: ""

# GitHub App (required). Private key as a YAML literal block:
GITHUB_APP_ID: ""
GITHUB_APP_PRIVATE_KEY: |
  -----BEGIN RSA PRIVATE KEY-----
  ...
  -----END RSA PRIVATE KEY-----
GITHUB_APP_INSTALLATION_ID: ""
GITHUB_WEBHOOK_SECRET: ""
GITHUB_APP_CLIENT_ID: ""
GITHUB_APP_CLIENT_SECRET: ""

# Empty allowlists = all installed repos allowed.
ALLOWED_GITHUB_ORGS: ""
ALLOWED_GITHUB_REPOS: ""
DEFAULT_REPO_OWNER: ""
DEFAULT_REPO_NAME: ""

# Slack (optional).
SLACK_BOT_TOKEN: ""
SLACK_SIGNING_SECRET: ""
SLACK_BOT_USER_ID: ""
SLACK_BOT_USERNAME: "openswe"
SLACK_REPO_OWNER: ""
SLACK_REPO_NAME: ""

# Dashboard. Base URLs must be https://<your-domain>.
DASHBOARD_API_BASE_URL: "https://open-swe.example.com"
DASHBOARD_BASE_URL: "https://open-swe.example.com"
DASHBOARD_ALLOWED_ORIGINS: ""
CONFIGURED_ADMINS: ""
LANGGRAPH_URL: "http://backend:2024"
DASHBOARD_JWT_SECRET: ""          # openssl rand -hex 32

# Sandbox: local (agent runs in the backend container) or langsmith (+snapshot).
SANDBOX_TYPE: "local"

LANGCHAIN_TRACING_V2: "false"
TOKEN_ENCRYPTION_KEY: ""          # openssl rand -base64 32
