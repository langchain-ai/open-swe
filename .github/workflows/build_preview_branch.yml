name: Build preview branch

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      force:
        description: Republish even when the preview tree is unchanged
        type: boolean
        default: false
  schedule:
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: build-preview-branch
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild preview from main and labeled PRs
    if: >-
      github.event_name != 'pull_request_target'
      || contains(github.event.pull_request.labels.*.name, 'preview')
      || github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Require reapproval after a PR update
        if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'preview') }}" == true ]]; then
            gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/preview"
          fi
      - name: Reset the preview to main when due
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: uv run scripts/build_preview_branch.py reset
      - name: Install the latest oswe
        if: vars.OPEN_SWE_BACKEND_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh api "repos/${GH_REPO}/releases?per_page=30" --jq '[.[] | select(any(.assets[]; .name == "oswe-linux-x64.tar.gz"))][0].tag_name // ""')"
          if [[ -z "$tag" ]]; then
            echo "::warning::No release ships oswe yet; preview conflicts will not be resolved automatically."
            exit 0
          fi
          dir="$RUNNER_TEMP/oswe"
          gh release download "$tag" -p oswe-linux-x64.tar.gz -p oswe-SHA256SUMS -D "$dir"
          (cd "$dir" && sha256sum --check --ignore-missing oswe-SHA256SUMS && tar -xzf oswe-linux-x64.tar.gz)
          echo "$dir" >>"$GITHUB_PATH"
          "$dir/oswe" --version
      - name: Restore resolved conflicts
        uses: actions/cache/restore@v6
        with:
          path: .git/rr-cache
          key: preview-rerere-${{ github.run_id }}
          restore-keys: preview-rerere-
      - name: Assemble and publish the preview tree
        id: build
        env:
          EXCLUDE_PR_NUMBER: ${{ github.event.action == 'synchronize' && github.event.pull_request.number || '' }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPEN_SWE_BACKEND_URL: ${{ vars.OPEN_SWE_BACKEND_URL }}
        run: uv run scripts/build_preview_branch.py build
      - name: Save resolved conflicts
        if: steps.build.outputs.agent_resolved == 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/rr-cache
          key: preview-rerere-${{ github.run_id }}
