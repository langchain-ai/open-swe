name: Agent CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Agent lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run lint
        run: make lint

  format:
    name: Agent format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run format check
        run: make format-check

  unit-tests:
    name: Agent unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run unit tests
        run: make test

  ui-format:
    name: UI format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      # The root package too, for Turborepo — but not desktop, whose Electron
      # download this job has no use for.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter open-swe-dashboard... --filter open-swe
      - name: Run format check
        run: pnpm run format:check

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Install workspace dependencies
        env:
          ELECTRON_GET_USE_PROXY: "true"
        run: pnpm install --frozen-lockfile
      - name: Run desktop checks
        run: pnpm run check

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install Python deps (langgraph dev runtime)
        run: uv sync --locked
      - run: corepack enable
      - name: Install Playwright + Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          pnpm run test:e2e:install
      # Playwright's webServer boots `langgraph dev`; globalSetup builds the real
      # ui/ app and runs its server so the specs hit real server rendering. The
      # fake LLM/GitHub/Slack boundaries need no secrets.
      - name: Run E2E
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
