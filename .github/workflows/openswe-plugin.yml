name: Open SWE plugin builds

# Builds a repository's Open SWE plugins and publishes each build where installs read it.
# The newest build of each branch or tag is the asset `<name>-<commit>.html` of a release
# tagged `openswe-plugin/<name>/<ref>`; an install takes it and pins that commit. Deleting
# a branch deletes its releases.
#
# Call it from a workflow that runs on `push`, `workflow_dispatch` and `delete`, with
# `permissions: contents: write`. A repository with `.openswe-plugin/plugin.json` at its
# root has one plugin; one with `.openswe-plugin/marketplace.json` builds every plugin its
# marketplace lists by a directory in the same repository.

on:
  workflow_call:
    inputs:
      install:
        description: Installs dependencies, run once at the repository root
        type: string
        default: npm ci
      build:
        description: Builds one plugin, run in its directory; writes the manifest's `entry`
        type: string
        default: npm run build

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: openswe-plugin-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -c "$INSTALL"
      - name: Build and publish each plugin
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ github.ref_type == 'branch' }}
        run: |
          set -euo pipefail
          if [ -f .openswe-plugin/plugin.json ]; then
            dirs=(.)
          else
            mapfile -t dirs < <(jq -r '.plugins[].source | strings' .openswe-plugin/marketplace.json)
          fi
          for dir in "${dirs[@]}"; do
            manifest="$dir/.openswe-plugin/plugin.json"
            name="$(jq -r .name "$manifest")"
            entry="$(jq -r .entry "$manifest")"
            (cd "$dir" && bash -c "$BUILD")
            tag="openswe-plugin/$name/$REF"
            asset="$name-$SHA.html"
            cp "$dir/$entry" "$RUNNER_TEMP/$asset"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$SHA" --latest=false --prerelease="$PRERELEASE" \
                --title "$name · $REF" \
                --notes "Builds of the $name Open SWE plugin from $REF. Each build replaces the last; installs take the newest."
            fi
            gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber
            # Only the newest build is kept; an install copies what it takes.
            gh release view "$tag" --json assets --jq '.assets[].name' | { grep -vxF "$asset" || true; } |
              while read -r old; do gh release delete-asset "$tag" "$old" --yes; done
            echo "Published $asset to $tag"
          done

  cleanup:
    name: Delete a deleted branch's builds
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            # The tag is openswe-plugin/<name>/<ref>; names have no slash, refs may.
            if [[ "$tag" == openswe-plugin/* && "${tag#openswe-plugin/*/}" == "$BRANCH" ]]; then
              gh release delete "$tag" --yes --cleanup-tag
              echo "Deleted $tag"
            fi
          done
