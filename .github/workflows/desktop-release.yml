name: Release Desktop

on:
  workflow_call:
    inputs:
      release_ref:
        type: string
        default: main
      nightly:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - desktop/package.json

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  promote-desktop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Promote latest matching nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_version=$(node -p "require('./desktop/package.json').version")
          [[ "$stable_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          stable_tag="desktop-v${stable_version}"
          prefix="${stable_tag}-nightly."
          nightly_tag=""
          while read -r candidate; do
            if gh release view "$candidate" --json assets --jq '.assets | length >= 3' | grep -qx true; then
              nightly_tag="$candidate"
              break
            fi
          done < <(gh release list --limit 1000 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"${prefix}\"))) | .tagName")

          if [ -z "$nightly_tag" ]; then
            echo "No complete prerelease found matching ${prefix}*"
            exit 1
          fi
          if gh release view "$stable_tag" >/dev/null 2>&1; then
            echo "$stable_tag already has a release"
            exit 1
          fi

          nightly_sha=$(git rev-parse "${nightly_tag}^{commit}")
          git fetch origin prod
          if [ "$nightly_sha" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "$nightly_tag was not built from the currently deployed prod commit"
            exit 1
          fi
          if git rev-parse "refs/tags/${stable_tag}" >/dev/null 2>&1; then
            test "$(git rev-parse "${stable_tag}^{commit}")" = "$nightly_sha"
          else
            git tag "$stable_tag" "$nightly_sha"
            git push origin "$stable_tag"
          fi
          gh release edit "$nightly_tag" \
            --tag "$stable_tag" \
            --title "Open SWE Desktop v${stable_version}" \
            --prerelease=false \
            --latest

  release-desktop:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || 'main' }}
          fetch-depth: 0

      - name: Resolve desktop release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          stable_version=$(node -p "require('./desktop/package.json').version")
          [[ "$stable_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [ "$NIGHTLY" = "true" ]; then
            timestamp=$(date -u +%Y%m%d%H%M%S)
            version=$(node -p "const [major, minor, patch] = '${stable_version}'.split('.').map(Number); [major, minor, patch + 1].join('.')")
            tag="desktop-v${version}-nightly.${timestamp}"
            prerelease=true
            label="Open SWE Desktop Nightly ${timestamp}"
          else
            stable_tag="desktop-v${stable_version}"
            version="$stable_version"
            tag="$stable_tag"
            prerelease=false
            label="Open SWE Desktop v${version}"
            if git rev-parse "refs/tags/${stable_tag}" >/dev/null 2>&1; then
              if gh release view "$stable_tag" --json assets --jq '.assets | length >= 3' | grep -qx true; then
                echo "$stable_tag already has a complete release"
                exit 1
              fi
              git checkout --detach "$stable_tag"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Set build version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const path='desktop/package.json'; const pkg=require('./'+path); pkg.version=process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\n')"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: corepack enable

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Install workspace dependencies
        env:
          ELECTRON_GET_USE_PROXY: "true"
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          SIGNING_CERT_B64: ${{ secrets.APPLE_SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          printf '%s' "$SIGNING_CERT_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build macOS distribution
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm run build
          pnpm --filter open-swe-desktop exec electron-builder --mac zip dmg --publish never

      - name: Verify and package release assets
        id: assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          shopt -s nullglob
          mac_zips=(desktop/dist/"Open SWE-${VERSION}"-*-mac.zip)
          mac_dmgs=(desktop/dist/"Open SWE-${VERSION}"-*.dmg)

          if [ "${#mac_zips[@]}" -ne 1 ] || [ "${#mac_dmgs[@]}" -ne 1 ]; then
            echo "Expected one macOS zip and one DMG for version ${VERSION}"
            ls -la desktop/dist
            exit 1
          fi

          unpacked="desktop/dist/release-unpacked"
          mkdir -p "$unpacked"
          ditto -x -k "${mac_zips[0]}" "$unpacked"

          apps=("$unpacked"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected one app bundle in ${mac_zips[0]}"
            ls -la "$unpacked"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          hdiutil verify "${mac_dmgs[0]}"

          app_zip="desktop/dist/Open SWE-${VERSION}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "$app_zip"

          echo "mac_zip=${mac_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "mac_dmg=${mac_dmgs[0]}" >> "$GITHUB_OUTPUT"
          echo "app_zip=$app_zip" >> "$GITHUB_OUTPUT"

      - name: Tag desktop version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.label }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.assets.outputs.mac_zip }}
            ${{ steps.assets.outputs.mac_dmg }}
            ${{ steps.assets.outputs.app_zip }}

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/AuthKey.p8"
