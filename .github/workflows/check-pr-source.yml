name: Check PR source

# Open SWE is developed in LangChain's internal monorepo, and Copybara pushes
# it straight to this repo's main, so nothing reaches main through a pull
# request here. Anything merged by another route is missing from the monorepo,
# and the next export reverts it.
#
# Escape hatch for an urgent production fix: add the `skip-pr-source-check`
# label. Afterwards make the same change in the monorepo before the next
# export.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check:
    # Make this a required check on main once the export is live.
    name: PR comes from the monorepo
    if: github.repository == 'langchain-ai/open-swe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse pull requests to main
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-pr-source-check') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "::warning::skip-pr-source-check label present. After merging, make the same change in the monorepo so the next export does not revert it."
            exit 0
          fi
          echo "::error::Open SWE is developed in LangChain's internal monorepo, and Copybara exports it to this repo's main. Make the change there. For an urgent production fix, add the skip-pr-source-check label."
          exit 1
