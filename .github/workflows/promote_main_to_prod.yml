name: Promote main to prod

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: promote-main-to-prod
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck the commit to promote
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Record candidate commit
        id: candidate
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run typecheck
        run: make typecheck

  promote:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.typecheck.outputs.sha }}
          fetch-depth: 0
      - name: Force-push the typechecked commit to prod
        run: |
          git push --force origin HEAD:refs/heads/prod
      - name: Tag and dispatch desktop patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(git tag --list 'desktop-v*' | grep -E '^desktop-v[0-9]+\\.[0-9]+\\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest_tag" ]; then
            IFS=. read -r major minor patch <<< "${latest_tag#desktop-v}"
          else
            major=0
            minor=0
            patch=0
          fi
          patch=$((patch + 1))
          tag="desktop-v${major}.${minor}.${patch}"
          while git rev-parse "refs/tags/$tag" >/dev/null 2>&1; do
            patch=$((patch + 1))
            tag="desktop-v${major}.${minor}.${patch}"
          done
          git tag "$tag"
          git push origin "refs/tags/$tag"
          gh workflow run desktop-release.yml --ref "$tag" -f "tag=$tag"
