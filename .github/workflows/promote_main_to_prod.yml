name: Release to prod

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: [.github/production-release]

concurrency:
  group: promote-main-to-prod
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck the commit to promote
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Read the approved release commit
        id: candidate
        shell: bash
        run: |
          candidate="$(cat .github/production-release)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::The release must pin a full commit SHA."
            exit 1
          }
          git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
          git merge-base --is-ancestor origin/prod "$candidate" || {
            echo "::error::The release must include the current prod commit."
            exit 1
          }
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" == "$(git rev-parse origin/prod)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git checkout --detach "$candidate"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.candidate.outputs.changed == 'true'
      - name: Install dependencies
        if: steps.candidate.outputs.changed == 'true'
        run: uv sync --locked --extra dev
      - name: Run typecheck
        if: steps.candidate.outputs.changed == 'true'
        run: make typecheck

  promote:
    needs: typecheck
    if: needs.typecheck.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.typecheck.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward prod to the approved commit and summarize released PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_SHA="$(git rev-parse origin/prod)"
          PROMOTED_SHA="$(git rev-parse HEAD)"
          RELEASE_COMMITS="$(git log origin/prod..HEAD --format=%s)"
          export PREVIOUS_SHA PROMOTED_SHA RELEASE_COMMITS
          git push origin HEAD:refs/heads/prod
          python3 - <<'PY'
          import os
          import re
          import subprocess

          released = {}
          for subject in os.environ["RELEASE_COMMITS"].splitlines():
              match = re.search(r"\(#(\d+)\)$|^Merge pull request #(\d+)\b", subject)
              if match:
                  number = match.group(1) or match.group(2)
                  released.setdefault(number, subject)
          lines = []
          for number, subject in released.items():
              url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/pull/{number}"
              try:
                  title = subprocess.check_output(
                      ["gh", "pr", "view", url, "--json", "title", "--jq", ".title"],
                      text=True,
                      timeout=30,
                  ).strip()
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  print(f"::warning::Could not fetch title for PR #{number}: {exc}")
                  title = subject
              lines.append(f"- {title} — {url}")
          message = "\n".join(lines) or "No new PRs identified in the promoted commits."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              previous = os.environ["PREVIOUS_SHA"]
              promoted = os.environ["PROMOTED_SHA"]
              summary.write(
                  f"## Production promotion\n\n"
                  f"- Promoted commit: [{promoted[:12]}]({repo_url}/commit/{promoted})\n"
                  f"- [Changes since previous promotion]({repo_url}/compare/{previous}...{promoted})\n"
                  f"- Python typecheck: passed for the promoted commit\n\n"
                  f"## Released PRs\n\n{message}\n"
              )
          PY

  deploy-mda:
    name: Deploy the Managed Deep Agents runtime
    needs: [typecheck, promote]
    uses: ./.github/workflows/deploy_mda.yml
    with:
      environment: prod
      ref: ${{ needs.typecheck.outputs.sha }}
    secrets: inherit

  release-desktop-nightly:
    needs: [typecheck, promote]
    uses: ./.github/workflows/desktop-release.yml
    with:
      release_ref: ${{ needs.typecheck.outputs.sha }}
      nightly: true
    secrets: inherit
