name: Deploy UI to S3

# Runs on every push to main, not only ui/ changes: the bundle's commit stamp must
# match the backend's, or VersionMismatchBanner asks for a reload that can't help.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write

concurrency:
  group: deploy-ui
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388096320259:role/deploy-openswe-ui-role
          aws-region: eu-north-1
      # Without Cache-Control, browsers heuristically cache index.html past a deploy,
      # where no CloudFront invalidation reaches. Hashed assets go up first so the new
      # HTML never references a chunk that isn't there yet; old chunks are pruned last.
      - name: Upload hashed assets
        run: >-
          aws s3 sync .output/public/assets s3://openswe-ui/assets
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload everything else
        # cp, not sync: sync skips unchanged files, which would keep their old headers.
        run: >-
          aws s3 cp .output/public s3://openswe-ui --recursive
          --exclude "assets/*" --cache-control "no-cache"
      - name: Remove files no longer in the build
        run: aws s3 sync .output/public s3://openswe-ui --delete --size-only
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id EWJY2Y4FUXCXK \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id EWJY2Y4FUXCXK --id "$id"
