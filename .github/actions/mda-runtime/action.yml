name: Managed Deep Agents runtime
description: >-
  Sync mda/'s environment. When it takes managed-deepagents from an SDK commit,
  fetch that commit with a read-only token the org's GitHub App mints for the SDK,
  and with `cli` build its mda CLI into it.
inputs:
  app-private-key:
    description: >-
      Private key of the langchain-actions-pr-bot GitHub App (LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY),
      which mints a read-only token for langchain-ai/managed-deepagents-sdk.
    required: false
    default: ""
  cli:
    description: Also install the mda CLI built from the SDK commit.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: source
      shell: bash
      run: echo "sha=$(scripts/mda_cli.sh sha)" >>"$GITHUB_OUTPUT"
    - if: steps.source.outputs.sha != '' && inputs.app-private-key == ''
      shell: bash
      run: |
        echo "::error::mda/ takes managed-deepagents from an SDK commit, which needs LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY to read"
        exit 1
    - id: sdk-token
      if: steps.source.outputs.sha != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: "Iv23liMFOFBcPTKFWi3S"
        private-key: ${{ inputs.app-private-key }}
        owner: langchain-ai
        repositories: managed-deepagents-sdk
        permission-contents: read
    - if: steps.source.outputs.sha != ''
      shell: bash
      env:
        TOKEN: ${{ steps.sdk-token.outputs.token }}
      run: |
        # uv and the CLI build fetch the SDK commit with it; the runner is discarded with the job.
        git config --global url."https://x-access-token:${TOKEN}@github.com/langchain-ai/managed-deepagents-sdk".insteadOf https://github.com/langchain-ai/managed-deepagents-sdk
    - shell: bash
      working-directory: mda
      run: uv sync --locked
    - if: steps.source.outputs.sha != '' && inputs.cli == 'true'
      uses: actions/cache@v6
      with:
        path: mda/.sdk/target
        key: mda-cli-${{ runner.os }}-${{ steps.source.outputs.sha }}
    - if: steps.source.outputs.sha != '' && inputs.cli == 'true'
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: stable
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        scripts/mda_cli.sh
