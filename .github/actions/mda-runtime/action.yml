name: Managed Deep Agents runtime
description: >-
  Sync mda/'s environment. When it takes managed-deepagents from an SDK commit,
  fetch that commit with read access to the SDK, and with `cli` build its mda CLI into it.
inputs:
  token:
    description: Read-only token for langchain-ai/managed-deepagents-sdk (MDA_SDK_SOURCE_TOKEN).
    required: false
    default: ""
  cli:
    description: Also install the mda CLI built from the SDK commit.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: source
      shell: bash
      run: echo "sha=$(scripts/mda_cli.sh sha)" >>"$GITHUB_OUTPUT"
    - if: steps.source.outputs.sha != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::mda/ takes managed-deepagents from an SDK commit; add the MDA_SDK_SOURCE_TOKEN secret (read access to langchain-ai/managed-deepagents-sdk)"
          exit 1
        fi
        # uv and the CLI build fetch the SDK commit with it; the runner is discarded with the job.
        git config --global url."https://x-access-token:${TOKEN}@github.com/langchain-ai/managed-deepagents-sdk".insteadOf https://github.com/langchain-ai/managed-deepagents-sdk
    - shell: bash
      working-directory: mda
      run: uv sync --locked
    - if: steps.source.outputs.sha != '' && inputs.cli == 'true'
      uses: actions/cache@v6
      with:
        path: mda/.sdk/target
        key: mda-cli-${{ runner.os }}-${{ steps.source.outputs.sha }}
    - if: steps.source.outputs.sha != '' && inputs.cli == 'true'
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: stable
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        scripts/mda_cli.sh
