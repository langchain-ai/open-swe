[project]
name = "open-swe-agent"
version = "0.1.0"
description = "Open SWE Agent - Python agent for automating software engineering tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents==0.7.8",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "PyJWT>=2.13.0",
    "cryptography>=50.0.0",
    "langgraph-sdk>=0.4.3",
    "langchain>=1.3.16",
    "langgraph>=1.2.11",
    "markdownify>=1.2.3",
    "langchain-anthropic>=1.6.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.1",
    "langchain-openai>=1.6.0,<2.0.0",
    "langchain-fireworks>=1.6.0",
    # langchain-fireworks 1.4.2 pins a pre-release fireworks-ai; opt in explicitly so uv resolves it.
    "fireworks-ai>=1.2.9",
    "langchain-daytona>=0.0.8",
    "langchain-modal>=0.0.6",
    "langchain-runloop>=0.0.7",
    "langchain-e2b==0.0.6",
    "exa-py>=2.18.1",
    "langchain-google-genai>=4.3.5",
    "langchain-mcp-adapters>=0.3.2",
    "stagehand>=3.23.0,<4",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "Pygments>=2.21.0",
]

[tool.uv]
# The externally maintained langchain-e2b integration still declares
# `deepagents<0.7.0`, but 0.7.8 keeps the sandbox API backward compatible. Its e2b
# dependency also caps wcmatch<11.0 while deepagents requires wcmatch>=11.0, so
# override both transitive bounds until langchain-e2b publishes compatible metadata.
override-dependencies = ["deepagents==0.7.8", "wcmatch>=11.0"]
# Each langgraph-api release pins its langgraph-runtime-inmem peer to a single
# minor window expressed in `.dev0` bounds (`>=0.32.0.dev0,<0.33.0.dev0`), which
# uv's default pre-release policy shies away from, so a plain resolve lands on the
# end-of-life 0.10.3. Hold the local dev server at the version `langgraph.json`
# declares for the deployment, so tests run against the runtime that serves prod.
constraint-dependencies = ["langgraph-api>=0.12.7,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "TID251",
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Do not use postponed annotation evaluation."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["agent", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "ui", "**/.*"]
reportMissingTypeStubs = false
