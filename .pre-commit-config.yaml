default_install_hook_types:
  - pre-commit
default_stages:
  - pre-commit

exclude: ^(vendor/|openwiki/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
        # Style-only shellcheck findings already in the release and deploy scripts.
        args: [-ignore, 'SC2129|SC2155']
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false
  - repo: local
    hooks:
      - id: rumdl
        name: Reflow Markdown to one sentence per line
        # Settings live in .rumdl.toml. Jinja tag lines are shielded by the script.
        entry: python scripts/reflow_markdown.py
        language: python
        additional_dependencies: ['rumdl==0.3.0']
        files: \.md(\.jinja)?$
        # A generated e2e fixture compared byte for byte.
        exclude: ^tests/e2e/tests/thread_context\.md$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: &generated ^(LICENSE|.*\.(svg|patch|txt|tla))$|^openswe/resources/prompts/tools/
      - id: trailing-whitespace
        exclude: *generated
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ['--maxkb=3072']
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^docs/(DEVELOPMENT|INSTALLATION)\.md$
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
