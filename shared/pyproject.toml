[project]
name = "open-swe-shared"
version = "0.0.0"
description = "Tool-call middleware the Open SWE backend and its Managed Deep Agents runtime both run, until it all lives in MDA."
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "langchain",
    "langchain-core",
    "langgraph",
    "langsmith",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openswe_shared"]

[tool.ruff]
extend = "../pyproject.toml"
# MDA builds run Python 3.13.
target-version = "py312"
