packages:
  - bridge-client
  - ui
  - desktop
  - cli
  - tests/e2e

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true

# unplugin's typings import "bun"; a hoisted @types/bun would inject Bun globals into ui's tsc.
hoistPattern:
  - '*'
  - '!@types/bun'
  - '!bun-types'

minimumReleaseAgeExclude:
  - '@datadog/browser-core@7.15.0'
  - '@datadog/browser-rum-core@7.15.0'
  - '@datadog/browser-rum@7.15.0'
  - '@datadog/js-core@0.0.16'
  - '@hono/node-server@2.1.3'
  - '@modelcontextprotocol/sdk@1.31.0'
  - hono@4.13.11

overrides:
  '@hono/node-server': 2.1.3
  '@pierre/trees>@pierre/theming': 1.0.1
  brace-expansion@2.1.1: 2.1.7
  crossws: 0.4.12
  'brace-expansion@>=5.0.0': 5.0.12
  dompurify: 3.4.16
  fast-uri: 3.1.8
  '@xmldom/xmldom': 0.8.15
  qs: 6.16.0
  hono: 4.13.11
  ip-address: 10.7.2
  js-yaml: 4.3.2
  mermaid: 12.0.0
  'nanoid@>=3.0.0 <4.0.0': 3.3.19
  postcss: 8.5.28
  undici: 7.30.0

patchedDependencies:
  '@electron/osx-sign@1.3.3': desktop/patches/@electron__osx-sign@1.3.3.patch
