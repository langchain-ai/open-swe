packages:
  - apps/*
  - packages/*
  - ui
  - desktop
  - tests/e2e

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  node: true
  node-pty: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - deepagents@1.13.1

overrides:
  '@hono/node-server': 2.0.10
  brace-expansion@2.1.1: 2.1.4
  'brace-expansion@>=5.0.0': 5.0.9
  dompurify: 3.4.13
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  mermaid: 11.16.1
  'nanoid@>=3.0.0 <4.0.0': 3.3.18
  postcss: 8.5.23
  undici: 7.29.0
