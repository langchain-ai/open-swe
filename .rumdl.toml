# Markdown reflow, run by the `rumdl` pre-commit hook.
# Fix locally with `uvx rumdl@0.3.0 check --fix <files>`.

[global]
enable = ["MD013", "MD029"]

[MD013]
# One sentence per line, however long, so an edited sentence changes one line of the diff.
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"
code-blocks = false
tables = false

[MD029]
# Every item is numbered 1., so inserting or moving an item does not renumber the ones after it.
style = "one"

[per-file-ignores]
# Prompts, skills and agent instructions refer to steps by number.
"openswe/resources/prompts/**" = ["MD029"]
"openswe/bundled_skills/**" = ["MD029"]
".claude/**" = ["MD029"]
".agents/**" = ["MD029"]
".open-swe/**" = ["MD029"]
"**/AGENTS.md" = ["MD029"]
